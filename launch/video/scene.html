<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nhako Tools launch</title>
<meta name="viewport" content="width=1080">
<!--
  The launch video, as a page. render.mjs serves this, calls renderFrame(t)
  once per frame and screenshots it. `node launch/video/render.mjs --serve`
  prints a URL; add ?play to watch it in real time with the soundtrack.

  The look is an Apple keynote: SF Pro Display, large tight headlines that
  arrive word by word out of a blur, a small accent eyebrow, a titanium iPhone
  that moves in 3D on a plain off-white stage. Colour is flat and comes from
  the site's tokens (ink, grey, and --pink-600 as the one accent); there are no
  gradient colours. The one thing kept from NeraOS is its pixel butterflies,
  flying at three depths, sharp in the middle and out of focus near the lens.
-->
<style>
  :root {
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --bg: #fbfbfd;
    --accent: #c7009b;
    --sf: 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sf); color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas, img.px { image-rendering: pixelated; display: block; }
  .abs { position: absolute; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #night { inset: 0; background: #000; opacity: 0; }

  /* --- Words -------------------------------------------------------------- */
  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .accent { color: var(--accent); }
  .dark .accent { color: #ff7ddf; }
  #intro { left: 0; right: 0; top: 700px; text-align: center; z-index: 30; }
  #intro div { font-size: 150px; font-weight: 700; letter-spacing: -0.04em; word-spacing: 0.05em; line-height: 1.08; }

  #cap { left: 70px; right: 70px; bottom: 1400px; text-align: center; z-index: 30; }
  #cap .eyebrow { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 14px; }
  #cap .head { font-size: 82px; font-weight: 700; letter-spacing: -0.03em; word-spacing: 0.06em; line-height: 1.06; text-wrap: balance; }
  #cap .sub { font-size: 40px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink-2); margin-top: 18px; line-height: 1.25; text-wrap: balance; }
  #cap.dark .head { color: #f5f5f7; }
  #cap.dark .sub { color: #a1a1a6; }

  /* The veil keeps a zoomed phone from running under the headline. */
  #veil { left: 0; right: 0; top: 0; height: 760px; z-index: 25; opacity: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 62%, rgba(251, 251, 253, 0) 100%); }

  /* --- Phone ---------------------------------------------------------------- */
  .phone { position: absolute; width: 636px; height: 1336px; will-change: transform; }
  #phone { left: 222px; top: 540px; z-index: 20; }
  .phone .frame { position: absolute; inset: 0; border-radius: 110px; background: #2b2b2f;
    box-shadow: 0 0 0 3px #d4d4d9, 0 70px 120px rgba(19, 19, 22, 0.2), 0 24px 44px rgba(19, 19, 22, 0.12); }
  .phone .bezel { position: absolute; inset: 7px; border-radius: 103px; background: #050506; }
  .phone .btn-side { position: absolute; width: 7px; border-radius: 4px; background: #3a3a40; }
  .phone .screen { position: absolute; left: 18px; top: 18px; width: 600px; height: 1300px; border-radius: 92px; overflow: hidden; background: #fff; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 83px; z-index: 5; background: #fff; }
  .status .time { position: absolute; left: 72px; top: 28px; font-family: 'SF Pro Text', var(--sf); font-weight: 600; font-size: 26px; letter-spacing: -0.01em; }
  .status svg { position: absolute; right: 48px; top: 31px; }
  .island { position: absolute; left: 50%; top: 17px; width: 190px; height: 56px; margin-left: -95px; border-radius: 28px; background: #000; z-index: 6; }
  .content { position: absolute; left: 0; top: 83px; width: 600px; height: 1217px; overflow: hidden; }
  .layer { position: absolute; left: 0; top: 0; width: 600px; will-change: transform, opacity; }
  .layer img { width: 600px; display: block; }
  #bars { position: absolute; left: 0; top: 0; width: 600px; z-index: 3; }
  .home-ind { position: absolute; left: 50%; bottom: 12px; width: 205px; height: 7px; margin-left: -102px; border-radius: 4px; background: #111; z-index: 7; }

  #tap { position: absolute; z-index: 8; left: 0; top: 0; }
  #tap .dot { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
    background: rgba(29, 29, 31, 0.2); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85); }

  /* The photo that flies into Compress image, and its progress */
  #file { z-index: 35; width: 420px; padding: 20px; display: flex; gap: 22px; align-items: center; border-radius: 30px;
    background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 30px 60px rgba(40, 24, 70, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.04); }
  #file canvas { width: 132px; height: 88px; border-radius: 14px; image-rendering: auto; }
  #file b { display: block; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  #file small { font-size: 26px; color: var(--ink-2); }
  #progress { z-index: 4; border-radius: 24px; background: #fff; box-shadow: 0 12px 30px rgba(40, 24, 70, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.05);
    display: flex; flex-direction: column; justify-content: center; padding: 0 34px; gap: 18px; }
  #progress .row { display: flex; justify-content: space-between; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  #progress .row span + span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #progress .track { height: 10px; border-radius: 5px; background: #ececf0; overflow: hidden; }
  #progress .fill { height: 100%; width: 0; border-radius: 5px; background: var(--accent); }

  /* The iPhone Home Screen the app lands on */
  #homescreen { position: absolute; inset: 0; z-index: 4; background: #ebe7f0; }
  .app { position: absolute; width: 100px; text-align: center; }
  .app .ic { width: 100px; height: 100px; border-radius: 23px; overflow: hidden; display: grid; place-items: center;
    box-shadow: 0 4px 10px rgba(40, 24, 70, 0.14); }
  .app .ic img { width: 100%; height: 100%; }
  .app span { display: block; margin-top: 8px; font-family: 'SF Pro Text', var(--sf); font-size: 19px; font-weight: 500; color: #1d1d1f; }
  #dock { position: absolute; left: 20px; right: 20px; bottom: 24px; height: 146px; border-radius: 50px;
    background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); }

  /* --- End card ------------------------------------------------------------- */
  #end { inset: 0; z-index: 30; text-align: center; }
  #end-icon { position: absolute; left: 50%; top: 470px; width: 288px; height: 288px; margin-left: -144px; border-radius: 66px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(40, 24, 70, 0.25), 0 12px 24px rgba(40, 24, 70, 0.12); }
  #end-icon img { width: 288px; height: 288px; }
  #end-icon::after { content: ''; position: absolute; inset: 0; border-radius: 66px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06); }
  #end-title { position: absolute; left: 0; right: 0; top: 830px; font-size: 128px; font-weight: 700; letter-spacing: -0.04em; word-spacing: 0.05em; }
  #end-tag { position: absolute; left: 0; right: 0; top: 1000px; font-size: 64px; font-weight: 600; color: var(--ink-2); letter-spacing: -0.03em; word-spacing: 0.05em; line-height: 1.12; }
  #end-url { position: absolute; left: 50%; top: 1230px; transform: translateX(-50%); padding: 26px 56px; border-radius: 999px;
    background: #1d1d1f; color: #fff; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  #end-small { position: absolute; left: 0; right: 0; top: 1390px; font-size: 34px; font-weight: 500; color: var(--ink-2); letter-spacing: -0.01em; }
  #fade { inset: 0; background: var(--bg); z-index: 60; opacity: 0; }

  /* Butterflies: far behind the phone, mid between, near in front and blurred */
  .flies { position: absolute; inset: 0; pointer-events: none; }
  #flies-far { z-index: 2; }
  #flies-mid { z-index: 24; }
  #flies-near { z-index: 40; }
  .bfly { position: absolute; left: 0; top: 0; will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div id="night" class="abs"></div>
  <div id="flies-far" class="flies"></div>

  <div id="intro" class="abs"></div>

  <div id="side-left"></div>
  <div id="side-right"></div>
  <div id="phone" class="phone"></div>

  <div id="veil" class="abs"></div>
  <div id="flies-mid" class="flies"></div>
  <div id="cap" class="abs"><div class="eyebrow"></div><div class="head"></div><div class="sub"></div></div>

  <div id="file" class="abs">
    <canvas id="thumb" width="264" height="176"></canvas>
    <div><b>holiday.png</b><small>5.5 MB</small></div>
  </div>

  <section id="end" class="abs">
    <div id="end-icon"><img class="px" src="../../public/icons/apple-touch-icon.png" alt=""></div>
    <div id="end-title"></div>
    <div id="end-tag"></div>
    <div id="end-url">tools.nhako.com</div>
    <div id="end-small"></div>
  </section>

  <div id="flies-near" class="flies"></div>
  <div id="fade" class="abs"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
