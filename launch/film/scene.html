<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nhako Tools launch film</title>
<meta name="viewport" content="width=1920">
<!--
  The widescreen launch film, as a page. render.mjs serves it, calls
  renderFrame(t) once per frame and screenshots it. `node launch/film/render.mjs
  --serve` prints a URL; add ?play to watch it with sound, or ?t=19.5 for one frame.

  An Apple keynote look, as in the phone film: SF Pro Display, headlines that
  rise word by word out of a blur, one accent (the site's --pink-600), flat
  colour, a plain off-white stage. The devices are a laptop and a tablet. The
  hint of NeraOS is its pixel butterflies, which fly in the air around the
  devices and never cross a screen.
-->
<link rel="stylesheet" href="devices.css">
<style>
  :root { --ink: #1d1d1f; --ink-2: #6e6e73; --bg: #fbfbfd; --accent: #c7009b;
    --sf: 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sf); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #night { inset: 0; background: #000; opacity: 0; }

  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .accent { color: var(--accent); }
  .dark .accent { color: #ff7ddf; }
  #intro { left: 0; right: 0; top: 330px; text-align: center; z-index: 30; }
  #intro div { font-size: 170px; font-weight: 700; letter-spacing: -0.045em; word-spacing: 0.05em; line-height: 1.06; }

  #cap { left: 160px; right: 160px; top: 62px; text-align: center; z-index: 30; }
  #cap .eyebrow { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px; }
  #cap .head { font-size: 74px; font-weight: 700; letter-spacing: -0.035em; word-spacing: 0.06em; line-height: 1.05; }
  #cap .sub { font-size: 31px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink-2); margin-top: 14px; }
  #cap.dark .head { color: #f5f5f7; }
  #cap.dark .sub { color: #a1a1a6; }
  /* Keeps a zoomed device from running under the headline. */
  #veil { left: 0; right: 0; top: 0; height: 380px; z-index: 25; opacity: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, rgba(251, 251, 253, 0) 100%); }

  #laptop, #tablet { z-index: 20; }

  /* End card */
  #end { inset: 0; z-index: 30; text-align: center; }
  #end-icon { position: absolute; left: 50%; top: 190px; width: 216px; height: 216px; margin-left: -108px; border-radius: 50px; overflow: hidden;
    box-shadow: 0 34px 70px rgba(40, 24, 70, 0.22), 0 10px 22px rgba(40, 24, 70, 0.1); }
  #end-icon img { width: 216px; height: 216px; image-rendering: pixelated; display: block; }
  #end-icon::after { content: ''; position: absolute; inset: 0; border-radius: 50px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06); }
  #end-title { position: absolute; left: 0; right: 0; top: 452px; font-size: 118px; font-weight: 700; letter-spacing: -0.045em; word-spacing: 0.05em; }
  #end-tag { position: absolute; left: 0; right: 0; top: 602px; font-size: 54px; font-weight: 600; color: var(--ink-2); letter-spacing: -0.03em; word-spacing: 0.05em; }
  #end-url { position: absolute; left: 50%; top: 722px; transform: translateX(-50%); padding: 20px 46px; border-radius: 999px;
    background: #1d1d1f; color: #fff; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  #end-small { position: absolute; left: 0; right: 0; top: 856px; font-size: 30px; font-weight: 500; color: var(--ink-2); letter-spacing: -0.01em; }
  #fade { inset: 0; background: var(--bg); z-index: 60; opacity: 0; }

  .flies { position: absolute; inset: 0; pointer-events: none; }
  #flies-far { z-index: 2; }
  #flies-front { z-index: 26; }
  #flies-near { z-index: 40; }
</style>
</head>
<body>
<div id="stage">
  <div id="night" class="abs"></div>
  <div id="flies-far" class="flies"></div>
  <div id="intro" class="abs"></div>
  <div id="laptop" class="abs"></div>
  <div id="tablet" class="abs"></div>
  <div id="veil" class="abs"></div>
  <div id="flies-front" class="flies"></div>
  <div id="cap" class="abs"><div class="eyebrow"></div><div class="head"></div><div class="sub"></div></div>
  <section id="end" class="abs">
    <div id="end-icon"><img src="../../public/icons/apple-touch-icon.png" alt=""></div>
    <div id="end-title"></div>
    <div id="end-tag"></div>
    <div id="end-url">tools.nhako.com</div>
    <div id="end-small"></div>
  </section>
  <div id="flies-near" class="flies"></div>
  <div id="fade" class="abs"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
