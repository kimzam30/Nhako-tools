<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canon phone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>:root{--accent:#c7009b}*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden}
.ic{flex:none}.logo{width:30px;height:30px;flex:none}.fly{width:22px;height:17px;flex:none}
.acc-bg{background:var(--accent);color:#fff}.acc{color:var(--accent)}
.cc{color:var(--c)}.cc-bg{background:var(--c);color:#fff}.cc-tint{background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--c)}
.tint{background:color-mix(in srgb,var(--accent) 9%,#fff)}.tint2{background:color-mix(in srgb,var(--accent) 15%,#fff)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1f2430;background:#f6f7fb}
.top{height:64px;background:#fff;display:flex;align-items:center;gap:26px;padding:0 48px;box-shadow:0 1px 0 #e7e9ef}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.menu{display:flex;gap:22px;font-weight:600;font-size:15px}
.cta{margin-left:auto;border-radius:8px;padding:9px 16px;font-weight:700}
.hero{text-align:center;padding:46px 0 26px}.hero h1{font-size:44px;font-weight:800;letter-spacing:-.02em}.hero p{margin-top:10px;font-size:19px;color:#5b6273}
.filters{display:flex;justify-content:center;gap:10px;margin-bottom:22px}.filters span{border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;background:#fff;border:1px solid #e1e4ea}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:0 110px}
.t{background:#fff;border-radius:12px;padding:18px;height:146px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.t .b{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.t b{display:block;font-size:16px}.t small{display:block;color:#5b6273;font-size:13px;margin-top:3px;line-height:1.35}
.tool{text-align:center;padding:60px 0}.tool h1{font-size:44px;font-weight:800}.tool p{font-size:19px;color:#5b6273;margin-top:10px}
.sel{display:inline-flex;gap:10px;align-items:center;border-radius:12px;padding:22px 52px;font-weight:800;font-size:22px;margin-top:36px;box-shadow:0 10px 24px -10px var(--accent)}
.ph .top{padding:0 16px;height:56px}.ph .hero{padding:24px 16px 14px}.ph .hero h1{font-size:26px}.ph .hero p{font-size:15px}

rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg></div><b>JPG to PDF</b></div><div class="t"><div class="b tint acc"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M9.5 12l1.3 5 1.2-4 1.2 4 1.3-5"/></svg></div><b>PDF to Word</b></div><div class="t"><div class="b tint acc"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg></div><b>Passport photo 35×50</b></div><div class="t"><div class="b tint acc"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg></div><b>Compress image to 100 KB</b></div><div class="t"><div class="b tint acc"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12v5M8 16h2M12 16h2"/></svg></div><b>Salary calculator</b></div><div class="t"><div class="b tint acc"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12v5M8 16h2M12 16h2"/></svg></div><b>CGPA calculator</b></div></div></div></body></html>
